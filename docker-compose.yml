services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: cgbcstream-mediamtx
    restart: always
    ports:
      - "1935:1935" # RTMP ingest — point the Web Presenter here
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    environment:
      # Overrides the placeholder "pass" in mediamtx.yml's authInternalUsers
      # (index 1, the "cgbcstream" API user) — MediaMTX's env-var config
      # override syntax. Must match MEDIAMTX_API_PASSWORD below exactly.
      - MTX_AUTHINTERNALUSERS_1_PASS=${MEDIAMTX_API_PASSWORD}

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cgbcstream-app
    restart: always
    depends_on:
      - mediamtx
    ports:
      - "3000:3000"
    environment:
      # Schedule times are this container's local time, so it must match the
      # times you enter in the UI. Override with TZ in .env if needed.
      - TZ=${TZ:-America/Chicago}
    env_file:
      - .env
    volumes:
      - ./data:/app/data # persists destinations/schedules across restarts
