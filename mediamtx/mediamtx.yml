# Minimal MediaMTX config for CGBCStream's ingest server.
# The Blackmagic Web Presenter pushes RTMP to rtmp://<vm-ip>:1935/live
# ffmpeg (in the app container) reads it back from rtmp://mediamtx:1935/live

rtmpAddress: :1935

# HLS output for the dashboard's input preview. Not published to the host
# in docker-compose — the backend proxies it at /hls so the browser only
# ever talks to the app's own origin (works through Cloudflare Tunnel,
# reverse proxies, HTTPS, etc.). hlsAllowOrigin is harmless to leave wide
# open even so, in case anything ever fetches this port directly.
hlsAddress: :8888
hlsAllowOrigin: "*"

# Control API the backend polls for input presence/track info
# (GET /v3/paths/get/live). Internal to the docker network — not published
# to the host in docker-compose.
apiAddress: :9997
api: yes

# Defining authInternalUsers at all replaces MediaMTX's built-in default
# list, so the "any" rule below has to be restated explicitly — otherwise
# the Web Presenter's RTMP push and the HLS preview would stop working.
# The API password itself comes from MTX_AUTHINTERNALUSERS_1_PASS (set via
# docker-compose from MEDIAMTX_API_PASSWORD in .env) — MediaMTX's default
# rules only allow unauthenticated API access from 127.0.0.1 inside its
# own container, which the backend (a separate container) isn't.
authInternalUsers:
  - user: any
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback

  - user: cgbcstream
    pass: changeme
    ips: []
    permissions:
      - action: api
      - action: metrics
      - action: pprof

paths:
  live:
    source: publisher
